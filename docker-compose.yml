version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: truckfleet-mongo
    ports:
      - "27021:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: truckfleet-backend
    environment:
      - MONGO_URL=mongodb://mongo:27017/truckfleet
      - JWT_SECRET=truckfleet_super_secret_jwt_key_2026_demo
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=development
    ports:
      - "3002:3002"
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: truckfleet-frontend
    environment:
      - VITE_BACKEND_URL=http://localhost:3002
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongo-data:
